name: Deploy

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# publishes site/ (config, stylesheet, preview page) to github pages as-is
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
